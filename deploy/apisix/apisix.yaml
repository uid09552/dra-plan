# Declarative APISIX configuration (standalone mode). ${{VAR}} values come from the container
# environment (see docker-compose.yml / .env).
#
# Browser: APISIX is the OIDC client (confidential realm client ${DRA_CLIENT_ID}, authorization code
# flow with PKCE). It keeps the tokens in an encrypted session cookie and forwards the access token to
# the backend. API/MCP clients send their own bearer token.
upstreams:
  - id: dra-backend
    type: roundrobin
    nodes:
      - host: "${{DRA_BACKEND_HOST}}"
        port: ${{DRA_BACKEND_PORT}}
        weight: 1
  - id: dra-ui
    type: roundrobin
    nodes:
      - host: "${{DRA_UI_HOST}}"
        port: ${{DRA_UI_PORT}}
        weight: 1
  - id: dra-keycloak
    type: roundrobin
    nodes:
      - host: keycloak
        port: 8080
        weight: 1

routes:
  # Keycloak's public /auth prefix is stripped; the server itself listens at /.
  - id: dra-keycloak
    uri: /auth/*
    priority: 20
    upstream_id: dra-keycloak
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/auth/(.*)"
          - "/$1"

  # Liveness is public.
  - id: dra-health
    uri: /api/v1/health
    methods: [GET]
    priority: 10
    upstream_id: dra-backend

  # MCP: bearer tokens only (AI clients), validated against Keycloak's JWKS.
  - id: dra-mcp
    uri: /mcp
    upstream_id: dra-backend
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      openid-connect:
        client_id: "${{APISIX_CLIENT_ID}}"
        client_secret: "${{APISIX_CLIENT_SECRET}}"
        discovery: "http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/openid-configuration"
        realm: "${{KEYCLOAK_REALM}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: true
        access_token_in_authorization_header: true
        set_userinfo_header: false

  # CORS preflight is safe and must work without an OIDC session.
  - id: dra-api-options
    uri: /api/*
    methods: [OPTIONS]
    priority: 10
    upstream_id: dra-backend
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      cors:
        allow_origins: "${{DRA_PUBLIC_URL}},${{UI_URL}}"
        allow_methods: "GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,If-Match,Accept,Origin,X-Requested-With"
        expose_headers: "ETag,Location,X-Request-Id"
        max_age: 600
        allow_credential: true

  # Read-only API methods are allowed to dra-viewer and dra-admin.
  - id: dra-api-read
    uri: /api/*
    methods: [GET, HEAD]
    upstream_id: dra-backend
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      openid-connect:
        client_id: "${{DRA_CLIENT_ID}}"
        client_secret: "${{DRA_CLIENT_SECRET}}"
        discovery: "http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/openid-configuration"
        realm: "${{KEYCLOAK_REALM}}"
        bearer_only: false
        unauth_action: deny
        use_jwks: true
        use_pkce: true
        redirect_uri: "${{DRA_PUBLIC_URL}}/oidc/callback"
        session:
          secret: "${{APISIX_SESSION_SECRET}}"
        # Forward the token to the backend (it reads the `tenant` claim).
        set_access_token_header: true
        access_token_in_authorization_header: true
        set_userinfo_header: false
        set_id_token_header: false
      authz-keycloak:
        discovery: "http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/uma2-configuration"
        client_id: "${{DRA_CLIENT_ID}}"
        client_secret: "${{DRA_CLIENT_SECRET}}"
        permissions: ["${{DRA_API_RESOURCE_ID}}"]
        http_method_as_scope: true
        policy_enforcement_mode: ENFORCING

  # Mutations require dra-admin; Keycloak evaluates the HTTP method as an authorization scope.
  - id: dra-api-write
    uri: /api/*
    methods: [POST, PUT, PATCH, DELETE]
    upstream_id: dra-backend
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      openid-connect:
        client_id: "${{DRA_CLIENT_ID}}"
        client_secret: "${{DRA_CLIENT_SECRET}}"
        discovery: "http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/openid-configuration"
        realm: "${{KEYCLOAK_REALM}}"
        bearer_only: false
        unauth_action: deny
        use_jwks: true
        use_pkce: true
        redirect_uri: "${{DRA_PUBLIC_URL}}/oidc/callback"
        session:
          secret: "${{APISIX_SESSION_SECRET}}"
        set_access_token_header: true
        access_token_in_authorization_header: true
        set_userinfo_header: false
        set_id_token_header: false
      authz-keycloak:
        discovery: "http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/uma2-configuration"
        client_id: "${{DRA_CLIENT_ID}}"
        client_secret: "${{DRA_CLIENT_SECRET}}"
        permissions: ["${{DRA_API_RESOURCE_ID}}"]
        http_method_as_scope: true
        policy_enforcement_mode: ENFORCING

  # Static UI assets are public: they contain no data and are the same for every user. Protecting
  # them would turn lazy-loaded chunks into login redirects after the session expired.
  - id: dra-ui-assets
    uri: /*
    vars:
      - ["uri", "~~", "\\.(js|mjs|css|map|woff2?|ttf|otf|ico|svg|png|jpe?g|webp|webmanifest|txt)$"]
    priority: -5
    upstream_id: dra-ui

  # UI (everything else): without a session → redirect to the Keycloak login page and back.
  # Also handles /oidc/callback (login) and /logout (ends the Keycloak session too).
  - id: dra-ui
    uri: /*
    priority: -10
    upstream_id: dra-ui
    plugins:
      openid-connect:
        client_id: "${{DRA_CLIENT_ID}}"
        client_secret: "${{DRA_CLIENT_SECRET}}"
        discovery: "http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/openid-configuration"
        realm: "${{KEYCLOAK_REALM}}"
        bearer_only: false
        unauth_action: auth
        use_pkce: true
        scope: "openid profile email organization"
        redirect_uri: "${{DRA_PUBLIC_URL}}/oidc/callback"
        logout_path: /logout
        post_logout_redirect_uri: "${{DRA_PUBLIC_URL}}/"
        session:
          secret: "${{APISIX_SESSION_SECRET}}"
        set_access_token_header: false
        set_userinfo_header: false
        set_id_token_header: false
#END
