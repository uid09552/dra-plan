      responses:
        '200':
          description: Measures with gap check
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecoveryStrategy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /microservices/{microserviceId}/recovery-strategies:
    parameters:
      - $ref: '#/components/parameters/MicroserviceId'
    get:
      tags: [Recovery Strategies]
      operationId: listRecoveryStrategies
      summary: List mitigation / recovery strategy candidates (workflow step 8)
      parameters:
        - name: scenarioId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Strategies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecoveryStrategy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Recovery Strategies]
      operationId: createRecoveryStrategy
      summary: Add a mitigation / recovery strategy candidate for a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryStrategyCreate' }
      responses:
        '201':
          description: Created. The response includes the gap check result.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryStrategy' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /recovery-strategies/{strategyId}:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    get:
      tags: [Recovery Strategies]
      operationId: getRecoveryStrategy
      summary: Get a strategy
      responses:
        '200':
          description: Strategy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryStrategy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Recovery Strategies]
      operationId: updateRecoveryStrategy
      summary: Update a strategy
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RecoveryStrategyFields' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryStrategy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Recovery Strategies]
      operationId: deleteRecoveryStrategy
      summary: Delete a strategy
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /recovery-strategies/{strategyId}/select:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    post:
      tags: [Recovery Strategies]
      operationId: selectRecoveryStrategy
      summary: Select this strategy for its microservice/scenario pair
      description: |
        Deselects any other strategy for the same microservice and scenario. If the gap check shows a gap
        (BSI Soll-Ist-Vergleich), `acceptGap` must be true and an action item is created.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategySelection' }
      responses:
        '200':
          description: Selected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryStrategy' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

