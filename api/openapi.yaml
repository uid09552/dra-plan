        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Recovery Objectives ─────────────────────────────
  /microservices/{microserviceId}/recovery-objectives:
    parameters:
      - $ref: '#/components/parameters/MicroserviceId'
