                type: array
                items: { $ref: '#/components/schemas/RunbookStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Runbooks]
      operationId: createRunbookStep
      summary: Add a mitigation step
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunbookStepCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookStep' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
