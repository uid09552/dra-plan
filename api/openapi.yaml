      operationId: getMicroservice
      summary: Get a microservice
      responses:
        '200':
          description: Microservice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Microservice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Microservices]
      operationId: updateMicroservice
      summary: Update a microservice
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MicroserviceFields' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Microservice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Microservices]
      operationId: deleteMicroservice
      summary: Delete a component (microservice) and its DR items
      description: The default component (`isDefault`) cannot be deleted (409).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Dependencies ─────────────────────────────
  /microservices/{microserviceId}/dependencies:
