  # ───────────────────────────── Workflow ─────────────────────────────
  /services/{serviceId}/workflow:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Workflow]
      operationId: getWorkflow
      summary: Workflow progress for all 15 steps, including current gate issues
      responses:
        '200':
          description: Workflow state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowState' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}/workflow/steps/{stepKey}/complete:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/StepKey'
    post:
      tags: [Workflow]
      operationId: completeWorkflowStep
      summary: Mark a step complete. The step's gate is evaluated.
      description: |
        Returns `422` with the blocking issues if the gate fails. For `select_scenarios` (the key gate)
        the caller must be the service's business owner or a tenant `reviewer`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepCompletion' }
      responses:
        '200':
          description: Step completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowStep' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}/workflow/steps/{stepKey}/reopen:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/StepKey'
    post:
      tags: [Workflow]
      operationId: reopenWorkflowStep
      summary: Reopen a completed step
      description: Downstream steps that depend on it are set to `needs_review`.
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Plan Versions ─────────────────────────────
  /services/{serviceId}/plan-versions:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Plan Versions]
      operationId: listPlanVersions
      summary: List plan versions (newest first)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PlanStatus' }
      responses:
        '200':
          description: Plan versions (without snapshot)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanVersionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Plan Versions]
      operationId: submitPlanVersion
      summary: Snapshot the current service subtree and submit it for review (workflow step 12)
      description: Fails with `422` if any workflow gate from steps 1–11 has blocking issues.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanSubmission' }
      responses:
        '201':
          description: Plan version in status `in_review`
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}/handbook:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Plan Versions]
      operationId: getDraftHandbook
      summary: Live preview of the emergency handbook from the current working data (draft, not approved)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Markdown handbook marked as DRAFT
          content:
            text/markdown:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /plan-versions/{planVersionId}:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    get:
      tags: [Plan Versions]
      operationId: getPlanVersion
      summary: Get a plan version including its immutable snapshot
      responses:
        '200':
          description: Plan version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /plan-versions/{planVersionId}/approve:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    post:
      tags: [Plan Versions]
      operationId: approvePlanVersion
      summary: Approve (reviewer only). Retires the previously approved version.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanApproval' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /plan-versions/{planVersionId}/reject:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    post:
      tags: [Plan Versions]
      operationId: rejectPlanVersion
      summary: Reject a version in review and return it to draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRejection' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /plan-versions/{planVersionId}/export:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    get:
      tags: [Plan Versions]
      operationId: exportPlanVersion
      summary: Export as a standalone document for offline or crisis use (emergency handbook)
      description: |
        `markdown` and `json` are implemented; `pdf` returns `501` for now. The same export is available offline
        through the CLI: `dra-server export --tenant <slug> --plan-version <id>`.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [markdown, pdf, json]
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Exported plan
          content:
            text/markdown:
              schema: { type: string }
            application/pdf:
              schema: { type: string, contentEncoding: binary }
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── DR Tests ─────────────────────────────
  /services/{serviceId}/dr-tests:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
