      responses:
        '200':
          description: Runbooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Runbooks]
