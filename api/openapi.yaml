        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Recovery Objectives]
      operationId: createRecoveryObjective
      summary: Define an objective (default, or per scenario)
      description: Validated against the service BIA (RTO ≤ service RTO ≤ MTPD, RPO ≤ service RPO).
