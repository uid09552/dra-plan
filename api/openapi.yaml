openapi: 3.1.0
info:
  title: dra-workflow API
  version: 0.1.0
  summary: Workflow-driven, AI-assisted IT service disaster recovery planning and execution.
  description: |
    REST API of the dra-workflow backend (Rust). It implements the data model in
    `docs/domain/dr-plan-model.md` and the workflows in `docs/workflows/`.

    **Hierarchy:** Tenant → IT service → microservice → DR items.

    **Methodology:** NIST SP 800-34 Rev. 1 and BSI-Standard 200-4 (see `docs/domain/standards-mapping.md`).

    ## Conventions
    - **Tenant from the token:** the tenant is **not** part of the path. The backend reads it from the
      `tenant_id` claim of the JWT access token and scopes every query to it. A token without a valid
      tenant claim, or for a tenant the user is not a member of, gets `403`. Ids belonging to another
      tenant return `404`. Only `GET/POST /tenants` (membership list, tenant creation) are tenant-independent.
    - **Collections** are nested under their parent (for example `/services/{serviceId}/microservices`).
      **Single items** are addressed flat by id (for example `/microservices/{microserviceId}`).
    - IDs are UUIDs. Durations are **integer minutes**. Timestamps are RFC 3339 UTC.
    - Updates use `PATCH` with `application/merge-patch+json` (RFC 7396).
    - Optimistic concurrency: every resource has a `version`. Reads return an `ETag`, and `PATCH`/`DELETE`
      accept `If-Match`. A stale version returns `412`.
    - Lists use cursor pagination (`cursor`, `limit`) and return `{ items, nextCursor }`.
    - Errors are `application/problem+json` (RFC 9457). Validation and workflow-gate failures return `422`
      with `issues`.
    - **"Mitigations"** are modeled as *recovery strategies* (how a microservice recovers from a scenario)
      plus *runbooks* containing ordered *runbook steps* (phases Activation → Recovery → Reconstitution).
    - AI output is always advisory. It is stored as an `AiSuggestion` and only applied after an explicit
      decision.
    - Besides this REST API, the same use cases are available to AI agents through the MCP endpoint
      `POST /mcp` (Streamable HTTP, JSON-RPC 2.0, use-case based tools; see docs/architecture/mcp.md).
servers:
  - url: /api/v1
    description: Relative to the deployment host
security:
  - bearerAuth: []

tags:
  - name: System
    description: Health and operational endpoints.
  - name: Tenants
    description: Tenants and tenant settings (NIST step 1 policy / BSI Initiierung).
  - name: Directory
    description: Tenant members, persons (contacts) and the DR role catalog (BSI BAO).
  - name: Catalog
    description: Seed data covering scenario templates, strategy types, test types and workflow steps.
  - name: Categories
    description: Tenant-defined scenario categories, in addition to the built-in ones (Settings > Categories).
  - name: IT Services
    description: Business-facing IT services (workflow step 1). They own the BIA, scenarios and plan versions.
  - name: Business Impact
    description: Business impact analysis (NIST step 2 / BSI BIA). Covers MTPD, RTO, RPO and minimum operating level.
  - name: Scenarios
    description: Brainstorm → consolidate → select disaster scenarios (BSI risk analysis).
  - name: Microservices
    description: >-
      Components of an IT service (called "components" in the UI; the API keeps the name microservice).
      They own the DR items. Components are optional for the user: every service has one default
      component (`isDefault`) that stands for the whole service and is created with it.
  - name: Dependencies
    description: Upstream and downstream dependencies (workflow step 2, NIST resource requirements).
  - name: Recovery Objectives
    description: RTO, RPO and MTTR per microservice and scenario (workflow step 7).
  - name: Recovery Strategies
    description: Mitigations per microservice and scenario, including the gap check (BSI Soll-Ist-Vergleich).
  - name: Data Protection
    description: Backup and replication configuration (BSI CON.3).
  - name: Runbooks
    description: Executable mitigation steps (NIST Activation / Recovery / Reconstitution).
  - name: Roles & Communication
    description: Role assignments with deputies, and communication rules (workflow steps 10–11).
  - name: Workflow
    description: Guided 15-step authoring workflow with gates.
  - name: Plan Versions
    description: Immutable, reviewable plan snapshots and export (workflow step 12).
  - name: DR Tests
    description: Tests and exercises (NIST step 6 / BSI Tests und Übungen).
  - name: Action Items
    description: Improvement actions from tests, runs, reviews and gap checks (workflow step 15).
  - name: AI Assistance
    description: Advisory AI suggestions that must be explicitly accepted before they reach the plan.
  - name: Recovery Runs
    description: Executing an approved plan during a disaster or a test.
  - name: Readiness
    description: 'DR readiness dashboard ("How ready are we?") and compliance mapping (requirement, what to do, evidence, status).'
  - name: Audit
    description: Append-only audit log.

paths:
  # ───────────────────────────── System ─────────────────────────────
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness / readiness
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Service is not ready (for example the database is unreachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ───────────────────────────── Tenants ─────────────────────────────
  /tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List tenants the caller is a member of (for tenant switching)
      description: Based on the user identity, not the tenant claim. To switch tenants, the client obtains a token for the other tenant from the identity provider.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tenants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create a tenant
      description: |
        The caller becomes the tenant `admin`. The default DR roles and settings are seeded.
        To work in the new tenant, the client must obtain a token that carries its `tenant_id` claim.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '201': { $ref: '#/components/responses/TenantCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /tenant:
    get:
      tags: [Tenants]
      operationId: getCurrentTenant
      summary: Get the current tenant (from the token)
      responses:
        '200': { $ref: '#/components/responses/TenantOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Tenants]
      operationId: updateCurrentTenant
      summary: Update the current tenant and its settings (admin)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TenantUpdate' }
      responses:
        '200': { $ref: '#/components/responses/TenantOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Tenants]
      operationId: deleteCurrentTenant
      summary: Delete the current tenant and all its data (admin)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Directory ─────────────────────────────
  /members:
    get:
      tags: [Directory]
      operationId: listMembers
      summary: List tenant members (application users)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Directory]
      operationId: addMember
      summary: Add a member with a tenant role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
      responses:
        '201':
          description: Member added
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Directory]
      operationId: updateMember
      summary: Change a member's tenant role
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Directory]
      operationId: removeMember
      summary: Remove a member
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /persons:
    get:
      tags: [Directory]
      operationId: listPersons
      summary: List persons (contact directory)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Search by name, email or team
          schema: { type: string }
      responses:
        '200':
          description: Persons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Directory]
      operationId: createPerson
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Directory]
      operationId: getPerson
      summary: Get a person
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Directory]
      operationId: updatePerson
      summary: Update a person
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/PersonFields' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Directory]
      operationId: deletePerson
      summary: Delete a person
      description: Fails with `409` while the person is still assigned to a role or owns open action items.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /roles:
    get:
      tags: [Directory]
      operationId: listRoles
      summary: List the DR role catalog (Incident Commander, DBA, and others)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Directory]
      operationId: createRole
      summary: Create a custom DR role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    patch:
      tags: [Directory]
      operationId: updateRole
      summary: Update a role
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RoleFields' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Directory]
      operationId: deleteRole
      summary: Delete a custom role
      description: Fails with `409` while the role is referenced by assignments or runbook steps.
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Catalog ─────────────────────────────
  /catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Seed data for the workflow (see docs/domain/scenario-catalog.md)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Categories ─────────────────────────────
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List the tenant's custom scenario categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Add a custom scenario category
      description: The key must not collide with a built-in `ScenarioCategory` or an existing custom one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomCategoryCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomCategory' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a custom scenario category
      description: Existing scenarios keep the category key as free text; only the picklist entry is removed.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── IT Services ─────────────────────────────
  /services:
    get:
      tags: [IT Services]
      operationId: listServices
      summary: List IT services
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string }
        - name: lifecycleStatus
          in: query
          schema: { $ref: '#/components/schemas/ServiceLifecycleStatus' }
        - name: reviewOverdue
          in: query
          description: Only services whose approved plan is past `nextReviewDue`
          schema: { type: boolean }
      responses:
        '200':
          description: IT services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItServicePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [IT Services]
      operationId: createService
      summary: Create an IT service (workflow step 1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItServiceCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItService' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [IT Services]
      operationId: getService
      summary: Get an IT service
      responses:
        '200':
          description: IT service
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItService' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [IT Services]
      operationId: updateService
      summary: Update an IT service
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ItServiceFields' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItService' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [IT Services]
      operationId: deleteService
      summary: Delete an IT service
      description: Fails with `409` while a recovery run is active. Approved plan versions are kept for audit.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}/dependency-graph:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [IT Services, Dependencies]
      operationId: getDependencyGraph
      summary: Dependency graph with RTO conflicts and a suggested restore order
      responses:
        '200':
          description: Graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyGraph' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}/validation:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [IT Services, Workflow]
      operationId: validateService
      summary: Run all integrity rules and gap checks for the service
      description: Evaluates the integrity rules in `docs/domain/dr-plan-model.md` (section 4).
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationReport' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Business Impact ─────────────────────────────
  /services/{serviceId}/bia:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Business Impact]
      operationId: getBia
      summary: Get the business impact analysis (workflow step 3)
      responses:
        '200':
          description: BIA
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessImpactAnalysis' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Business Impact]
      operationId: putBia
      summary: Create or replace the BIA
      description: Replaces all impact ratings. Validates RTO ≤ MTPD.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessImpactAnalysisInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessImpactAnalysis' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Scenarios ─────────────────────────────
  /services/{serviceId}/scenarios:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Scenarios]
      operationId: listScenarios
      summary: List scenarios of a service
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ScenarioStatus' }
        - name: category
          in: query
          schema: { type: string, description: A built-in ScenarioCategory key or a tenant-defined custom category key }
        - name: drRequired
          in: query
          schema: { $ref: '#/components/schemas/DrRequired' }
      responses:
        '200':
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Scenario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Scenarios]
      operationId: createScenario
      summary: Add a brainstormed scenario (workflow step 4)
      description: Starts in status `brainstormed`. It can be created from a catalog template.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}/scenario-suggestions:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Scenarios, Catalog]
      operationId: suggestScenarios
      summary: Catalog scenarios relevant for the service that are not captured yet (brainstorming help)
      description: >-
        Rule-based: derived from data stores, cloud hosting, external and identity-provider dependencies and the
        protection requirement. Accept a suggestion by creating a scenario with `catalogTemplateId`.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScenarioSuggestion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /scenarios/{scenarioId}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scenarios]
      operationId: getScenario
      summary: Get a scenario
      responses:
        '200':
          description: Scenario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Scenarios]
      operationId: updateScenario
      summary: Edit a scenario (text, category, affected microservices)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ScenarioFields' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Scenarios]
      operationId: deleteScenario
      summary: Delete a scenario
      description: Fails with `409` while objectives, strategies or runbooks reference it.
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /scenarios/{scenarioId}/merge:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags: [Scenarios]
      operationId: mergeScenarios
      summary: Consolidate similar scenarios into this one (workflow step 5)
      description: The source scenarios get status `merged` and `mergedIntoId` set to this scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioMergeRequest' }
      responses:
        '200':
          description: Target scenario after the merge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /scenarios/{scenarioId}/decision:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags: [Scenarios]
      operationId: decideScenario
      summary: Select or reject a scenario with a risk rating and rationale (workflow step 6)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioDecision' }
      responses:
        '200':
          description: Scenario after the decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Microservices ─────────────────────────────
  /services/{serviceId}/microservices:
