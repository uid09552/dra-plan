    post:
      tags: [Microservices]
      operationId: createMicroservice
      summary: Create a microservice under an IT service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicroserviceCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
