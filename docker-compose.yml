# Local development infrastructure: PostgreSQL, Keycloak (identity, organizations = tenants) and
# APISIX (API gateway validating Keycloak tokens). Settings and secrets come from `.env`
# (copy `.env.example`). Start with: docker compose up -d
#
# All containers share the internal network `drp`. The dra-workflow backend runs on the host
# (`make run-gateway`) and is reached by APISIX via host.docker.internal.
#
# Profile `app` adds the containerized backend and UI (nginx):
#   docker compose --profile app up -d --build      → UI and Keycloak through APISIX :9080
# To route APISIX to the backend container instead of the host, set DRA_BACKEND_HOST=backend in `.env`.


networks:
  drp:
    name: drp
    driver: bridge

volumes:
  dra_pgdata:

services:
  postgres:
    image: postgres:17-alpine
    container_name: dra_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by deploy/postgres/10-keycloak.sh on first initialization.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dra_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/00-dra.sql:ro
      - ./deploy/postgres/10-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    networks: [drp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dra -d dra"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: dra_keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Public URLs include /auth, which APISIX strips before proxying to Keycloak.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080/auth}
      # Keep advertised OIDC endpoints on the public /auth route.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Placeholders in deploy/keycloak/realm-dra.json.
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dra}
      DRA_API_RESOURCE_ID: ${DRA_API_RESOURCE_ID:-7f2f6f00-0000-4000-8000-000000000001}
      DRA_CLIENT_ID: ${DRA_CLIENT_ID:?set DRA_CLIENT_ID in .env}
      DRA_CLIENT_SECRET: ${DRA_CLIENT_SECRET:?set DRA_CLIENT_SECRET in .env}
      APISIX_CLIENT_ID: ${APISIX_CLIENT_ID:?set APISIX_CLIENT_ID in .env}
      APISIX_CLIENT_SECRET: ${APISIX_CLIENT_SECRET:?set APISIX_CLIENT_SECRET in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      UI_URL: ${UI_URL:-http://localhost:4200}
      DRA_PUBLIC_URL: ${DRA_PUBLIC_URL:-http://localhost:9080}
    volumes:
      - ./deploy/keycloak/realm-dra.json:/opt/keycloak/data/import/realm-dra.json:ro
    networks: [drp]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  apisix:
    image: apache/apisix:3.16.0-debian
    container_name: dra_apisix
    environment:
      APISIX_STAND_ALONE: "true"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dra}
      APISIX_CLIENT_ID: ${APISIX_CLIENT_ID}
      APISIX_CLIENT_SECRET: ${APISIX_CLIENT_SECRET}
      DRA_BACKEND_HOST: ${DRA_BACKEND_HOST:-backend}
      DRA_BACKEND_PORT: ${DRA_BACKEND_PORT:-8090}
      # UI behind the gateway (default: the `ui` container of profile `app`).
      DRA_UI_HOST: ${DRA_UI_HOST:-ui}
      DRA_UI_PORT: ${DRA_UI_PORT:-8080}
      UI_URL: ${UI_URL:-http://localhost:4200}
      # Browser login: APISIX is the OIDC client of the realm client ${DRA_CLIENT_ID}.
      DRA_PUBLIC_URL: ${DRA_PUBLIC_URL:-http://localhost:9080}
      DRA_API_RESOURCE_ID: ${DRA_API_RESOURCE_ID:-7f2f6f00-0000-4000-8000-000000000001}
      DRA_CLIENT_ID: ${DRA_CLIENT_ID}
      DRA_CLIENT_SECRET: ${DRA_CLIENT_SECRET}
      APISIX_SESSION_SECRET: ${APISIX_SESSION_SECRET:?set APISIX_SESSION_SECRET in .env (at least 32 characters)}
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./deploy/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [drp]
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Application (profile `app`) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
    image: dra-server:local
    container_name: dra_backend
    environment:
      # Role `dra` from deploy/postgres/init.sql (not a superuser, so row-level security applies).
      DRA_DATABASE_URL: postgres://dra:${DRA_DB_PASSWORD:-dra}@postgres:5432/dra
      DRA_LISTEN_ADDR: 0.0.0.0:8090
      DRA_MIGRATE_ON_START: "true"
      # Backend JWT validation is not implemented yet; without dev mode every API call returns 401.
      # Dev mode mocks authentication: only for local use, never on a shared network.
      DRA_DEV_MODE: ${DRA_DEV_MODE:-true}
      DRA_LOG_FORMAT: json
    networks: [drp]
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
    image: dra-ui:local
    container_name: dra_ui
    environment:
      BACKEND_URL: http://backend:8090
    networks: [drp]
    depends_on:
      backend:
        condition: service_healthy
